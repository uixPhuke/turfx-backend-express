# Local infrastructure only. Run API and worker with development environment.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: playza
      POSTGRES_DB: playza_development
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["playza-local-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playza -d playza_development"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["playza-local-redis:/data"]
volumes:
  playza-local-postgres:
  playza-local-redis:
